name: CI Full Product

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-product:
    name: Full product (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - name: Begin checkout timing
        shell: pwsh
        run: |
          "CI_OUTPUT=$env:GITHUB_WORKSPACE/ci-results/full-product-$env:RUNNER_OS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOTSTRAP_TIMINGS=$env:RUNNER_TEMP/ci1-full-product-bootstrap.ndjson" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @{stage="checkout"; command_identity="actions/checkout@v4"; started_at_utc=[DateTime]::UtcNow.ToString("o"); started_epoch_ms=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/ci1-full-product-checkout.json"

      - name: Check out accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false

      - name: Finish checkout timing and begin dependency timing
        shell: pwsh
        run: |
          $state = Get-Content -Raw "$env:RUNNER_TEMP/ci1-full-product-checkout.json" | ConvertFrom-Json
          $ended = [DateTimeOffset]::UtcNow
          @{stage=$state.stage; command_identity=$state.command_identity; started_at_utc=$state.started_at_utc; ended_at_utc=$ended.UtcDateTime.ToString("o"); elapsed_seconds=[Math]::Round(($ended.ToUnixTimeMilliseconds() - $state.started_epoch_ms) / 1000.0, 6); status="PASS"; exit_code=0} | ConvertTo-Json -Compress | Add-Content -Encoding utf8 "$env:BOOTSTRAP_TIMINGS"
          @{stage="dependency_setup"; command_identity="setup-python + locked pip dependencies + Playwright Chromium"; started_at_utc=[DateTime]::UtcNow.ToString("o"); started_epoch_ms=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/ci1-full-product-dependencies.json"

      - name: Set up Python
        id: python_setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: APP/requirements/requirements-dev.txt

      - name: Install locked application dependencies
        id: dependency_install
        run: python -m pip install --disable-pip-version-check -r APP/requirements/requirements-dev.txt

      - name: Install Chromium and Linux browser dependencies
        id: linux_browser_install
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium on Windows
        id: windows_browser_install
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Finish dependency timing
        if: always()
        shell: pwsh
        run: |
          $state = Get-Content -Raw "$env:RUNNER_TEMP/ci1-full-product-dependencies.json" | ConvertFrom-Json
          $ended = [DateTimeOffset]::UtcNow
          $browserStatus = if ("${{ runner.os }}" -eq "Linux") { "${{ steps.linux_browser_install.outcome }}" } else { "${{ steps.windows_browser_install.outcome }}" }
          $dependencyStatus = if ("${{ steps.python_setup.outcome }}" -eq "success" -and "${{ steps.dependency_install.outcome }}" -eq "success" -and $browserStatus -eq "success") { "PASS" } else { "FAIL" }
          $dependencyExitCode = if ($dependencyStatus -eq "PASS") { 0 } else { 1 }
          @{stage=$state.stage; command_identity=$state.command_identity; started_at_utc=$state.started_at_utc; ended_at_utc=$ended.UtcDateTime.ToString("o"); elapsed_seconds=[Math]::Round(($ended.ToUnixTimeMilliseconds() - $state.started_epoch_ms) / 1000.0, 6); status=$dependencyStatus; exit_code=$dependencyExitCode} | ConvertTo-Json -Compress | Add-Content -Encoding utf8 "$env:BOOTSTRAP_TIMINGS"

      - name: Run real full-product chain
        run: python ci/run_full_product.py --output "${{ env.CI_OUTPUT }}" --seed-timings "${{ env.BOOTSTRAP_TIMINGS }}"

      - name: Finalize bounded evidence
        if: always()
        run: python ci/finalize_artifacts.py --tier full-product-${{ runner.os }} --output "${{ env.CI_OUTPUT }}" --seed-timings "${{ env.BOOTSTRAP_TIMINGS }}"

      - name: Begin artifact upload timing
        if: always()
        shell: pwsh
        run: python ci/record_timing.py begin --stage artifact_upload --command "actions/upload-artifact@v4 ci-full-product-evidence" --state "$env:RUNNER_TEMP/ci1-full-product-upload.json"

      - name: Upload bounded full-product evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-full-product-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/full-product-${{ runner.os }}/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Record artifact upload timing
        if: always()
        shell: pwsh
        run: |
          $status = if ("${{ steps.evidence_upload.outcome }}" -eq "success") { "PASS" } else { "FAIL" }
          $exitCode = if ($status -eq "PASS") { 0 } else { 1 }
          python ci/record_timing.py finish --state "$env:RUNNER_TEMP/ci1-full-product-upload.json" --output "$env:CI_OUTPUT/stage-timings.json" --status $status --exit-code $exitCode
          python ci/finalize_artifacts.py --tier full-product-${{ runner.os }} --output "$env:CI_OUTPUT"

      - name: Upload timing receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-full-product-${{ runner.os }}-upload-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/full-product-${{ runner.os }}/stage-timings.json
            ci-results/full-product-${{ runner.os }}/artifact-index.json
            ci-results/full-product-${{ runner.os }}/classification.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
