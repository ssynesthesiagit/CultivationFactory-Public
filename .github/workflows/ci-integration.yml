name: CI Integration

on:
  push:
    branches:
      - work/win1-p1r3
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: Integration and portable-chain checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Begin checkout timing
        shell: pwsh
        run: |
          "CI_OUTPUT=$env:GITHUB_WORKSPACE/ci-results/integration" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOTSTRAP_TIMINGS=$env:RUNNER_TEMP/ci1-integration-bootstrap.ndjson" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @{stage="checkout"; command_identity="actions/checkout@v4"; started_at_utc=[DateTime]::UtcNow.ToString("o"); started_epoch_ms=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/ci1-integration-checkout.json"

      - name: Check out accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false

      - name: Finish checkout timing and begin dependency timing
        shell: pwsh
        run: |
          $state = Get-Content -Raw "$env:RUNNER_TEMP/ci1-integration-checkout.json" | ConvertFrom-Json
          $ended = [DateTimeOffset]::UtcNow
          @{stage=$state.stage; command_identity=$state.command_identity; started_at_utc=$state.started_at_utc; ended_at_utc=$ended.UtcDateTime.ToString("o"); elapsed_seconds=[Math]::Round(($ended.ToUnixTimeMilliseconds() - $state.started_epoch_ms) / 1000.0, 6); status="PASS"; exit_code=0} | ConvertTo-Json -Compress | Add-Content -Encoding utf8 "$env:BOOTSTRAP_TIMINGS"
          @{stage="dependency_setup"; command_identity="setup-python + locked pip dependencies + Playwright Chromium"; started_at_utc=[DateTime]::UtcNow.ToString("o"); started_epoch_ms=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/ci1-integration-dependencies.json"

      - name: Set up Python
        id: python_setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: APP/requirements/requirements-dev.txt

      - name: Install locked application dependencies
        id: dependency_install
        run: python -m pip install --disable-pip-version-check -r APP/requirements/requirements-dev.txt

      - name: Install official Chromium runtime
        id: browser_install
        run: python -m playwright install --with-deps chromium

      - name: Expose exact browser executable
        id: browser_executable
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              executable = playwright.chromium.executable_path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"TIANXIA_BROWSER_EXECUTABLE={executable}\n")

      - name: Finish dependency timing
        if: always()
        shell: pwsh
        run: |
          $state = Get-Content -Raw "$env:RUNNER_TEMP/ci1-integration-dependencies.json" | ConvertFrom-Json
          $ended = [DateTimeOffset]::UtcNow
          $dependencyStatus = if ("${{ steps.python_setup.outcome }}" -eq "success" -and "${{ steps.dependency_install.outcome }}" -eq "success" -and "${{ steps.browser_install.outcome }}" -eq "success" -and "${{ steps.browser_executable.outcome }}" -eq "success") { "PASS" } else { "FAIL" }
          $dependencyExitCode = if ($dependencyStatus -eq "PASS") { 0 } else { 1 }
          @{stage=$state.stage; command_identity=$state.command_identity; started_at_utc=$state.started_at_utc; ended_at_utc=$ended.UtcDateTime.ToString("o"); elapsed_seconds=[Math]::Round(($ended.ToUnixTimeMilliseconds() - $state.started_epoch_ms) / 1000.0, 6); status=$dependencyStatus; exit_code=$dependencyExitCode} | ConvertTo-Json -Compress | Add-Content -Encoding utf8 "$env:BOOTSTRAP_TIMINGS"

      - name: Run integration tier
        run: python ci/run_tier.py integration --output "${{ env.CI_OUTPUT }}" --seed-timings "${{ env.BOOTSTRAP_TIMINGS }}"

      - name: Finalize bounded evidence
        if: always()
        run: python ci/finalize_artifacts.py --tier integration --output "${{ env.CI_OUTPUT }}" --seed-timings "${{ env.BOOTSTRAP_TIMINGS }}"

      - name: Begin artifact upload timing
        if: always()
        shell: pwsh
        run: python ci/record_timing.py begin --stage artifact_upload --command "actions/upload-artifact@v4 ci-integration-evidence" --state "$env:RUNNER_TEMP/ci1-integration-upload.json"

      - name: Upload bounded integration evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/integration/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Record artifact upload timing
        if: always()
        shell: pwsh
        run: |
          $status = if ("${{ steps.evidence_upload.outcome }}" -eq "success") { "PASS" } else { "FAIL" }
          $exitCode = if ($status -eq "PASS") { 0 } else { 1 }
          python ci/record_timing.py finish --state "$env:RUNNER_TEMP/ci1-integration-upload.json" --output "$env:CI_OUTPUT/stage-timings.json" --status $status --exit-code $exitCode
          python ci/finalize_artifacts.py --tier integration --output "$env:CI_OUTPUT"

      - name: Upload timing receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-integration-upload-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/integration/stage-timings.json
            ci-results/integration/artifact-index.json
            ci-results/integration/classification.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 1

  linux-character-e2e:
    name: WIN1 Linux full-character Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      E2E_OUTPUT: ${{ github.workspace }}/ci-results/win1-linux-e2e
      TIANXIA_DATA_ROOT: ${{ runner.temp }}/WIN1-LINUX-E2E/LinuxE2EData
      TIANXIA_IMPORT_DATA_ROOT: ${{ runner.temp }}/WIN1-LINUX-E2E/LinuxE2EImportData
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: APP/requirements/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install locked application dependencies
        run: python -m pip install --disable-pip-version-check -r APP/requirements/requirements-dev.txt

      - name: Install official Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Expose exact browser executable
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              executable = playwright.chromium.executable_path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"TIANXIA_BROWSER_EXECUTABLE={executable}\n")

      - name: Run exact-head Linux full-character E2E
        run: |
          python ci/win1_linux_e2e.py \
            --output "$E2E_OUTPUT" \
            --data-root "$TIANXIA_DATA_ROOT" \
            --import-data-root "$TIANXIA_IMPORT_DATA_ROOT" \
            --browser "$TIANXIA_BROWSER_EXECUTABLE" \
            --expected-head "${{ github.sha }}"

      - name: Upload WIN1 Linux E2E evidence
        id: linux_e2e_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win1-linux-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/win1-linux-e2e/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
