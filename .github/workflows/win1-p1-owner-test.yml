name: WIN1-P1 Native Windows Owner Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win1-p1-owner-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-owner-test:
    name: Isolated native Windows owner-test build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/work/win1-p1'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Set up verified Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.0"
          architecture: "x64"

      - name: Prepare exact external native-build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Inputs = Join-Path $env:GITHUB_WORKSPACE "Inputs"
          $Wheels = Join-Path $Inputs "PrivateRuntimeWheels"
          New-Item -ItemType Directory -Force -Path $Inputs,$Wheels | Out-Null
          Copy-Item -LiteralPath "APP\BundledContent\Tianxia_Factory_HF05ZVK_R1H_Phase2I_HF2.zip" -Destination $Inputs
          gh release download win1-p1-build-inputs-v1 --repo "${{ github.repository }}" --pattern "Tianxia_Foundation_FactoryApp_Handoff_v1_0.zip" --dir $Inputs
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --platform win_amd64 --python-version 3.12 --implementation cp --abi cp312 --dest $Wheels -r "APP\packaging\windows_portable\requirements-private-runtime-wheelhouse-r66.lock.txt"
          if ($LASTEXITCODE -ne 0) { throw "Exact private-runtime wheel download failed." }
          $Inventory = Get-Content -Raw "APP\packaging\windows_portable\R6_6_PRIVATE_RUNTIME_WHEEL_INVENTORY.json" | ConvertFrom-Json
          $Actual = @(Get-ChildItem -LiteralPath $Wheels -File)
          if ($Actual.Count -ne $Inventory.wheels.Count) { throw "Wheelhouse file count mismatch." }
          foreach ($Row in $Inventory.wheels) {
            $Path = Join-Path $Wheels $Row.filename
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "Missing wheel: $($Row.filename)" }
            $Hash = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Hash -ne $Row.sha256) { throw "Wheel identity mismatch: $($Row.filename)" }
          }

      - name: Build and verify isolated owner-test delivery
        id: native_build
        shell: pwsh
        run: |
          $Node = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          $Output = Join-Path $env:RUNNER_TEMP "win1-p1-output"
          $Work = Join-Path $env:RUNNER_TEMP "win1-p1-work"
          .\win1_p1\Invoke-Win1P1Build.ps1 -OutputRoot $Output -WorkRoot $Work -PythonExe (Get-Command python).Source -NodeExe $Node

      - name: Install immutable first-cycle browser dependencies
        id: browser_dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r APP\requirements\requirements-dev.txt
          python -m playwright install chromium

      - name: Prove clean-extracted package execution boundary
        id: package_boundary
        shell: pwsh
        run: |
          $Output = Join-Path $env:RUNNER_TEMP "win1-p1-output"
          $Extracted = Join-Path $env:RUNNER_TEMP "win1-p1-clean-extracted"
          $Evidence = Join-Path $Output "Evidence\native-first-cycle"
          New-Item -ItemType Directory -Force -Path $Evidence | Out-Null
          python win1_p1\native_first_cycle_boundary.py `
            --repository $env:GITHUB_WORKSPACE `
            --delivery-zip (Join-Path $Output "Tianxia_WIN1_P1_Owner_Test.zip") `
            --extract-root $Extracted `
            --output (Join-Path $Evidence "package-execution-boundary.json")

      - name: Run complete owner browser first cycle
        id: native_first_cycle
        shell: pwsh
        working-directory: APP
        run: |
          $Output = Join-Path $env:RUNNER_TEMP "win1-p1-output"
          $Data = Join-Path $env:RUNNER_TEMP "win1-p1-clean-extracted\OwnerTestData"
          $Evidence = Join-Path $Output "Evidence\native-first-cycle"
          python tests\win1_p1r2r2_browser_harness.py --data $Data --output-root $Evidence

      - name: Upload bounded owner-test delivery and evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win1-p1-owner-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\win1-p1-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Create immutable upload receipt
        if: always()
        shell: pwsh
        run: |
          $Receipt = [ordered]@{
            schema = "Tianxia.WIN1P1.UploadReceipt.v1"
            repository = "${{ github.repository }}"
            run_id = [long]"${{ github.run_id }}"
            run_attempt = [int]"${{ github.run_attempt }}"
            job = "native-owner-test"
            head_sha = "${{ github.sha }}"
            artifact_id = "${{ steps.evidence_upload.outputs['artifact-id'] }}"
            artifact_digest = "${{ steps.evidence_upload.outputs['artifact-digest'] }}"
            artifact_url = "${{ steps.evidence_upload.outputs['artifact-url'] }}"
            build_outcome = "${{ steps.native_build.outcome }}"
            browser_dependencies_outcome = "${{ steps.browser_dependencies.outcome }}"
            package_boundary_outcome = "${{ steps.package_boundary.outcome }}"
            native_first_cycle_outcome = "${{ steps.native_first_cycle.outcome }}"
            upload_outcome = "${{ steps.evidence_upload.outcome }}"
          }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\win1-p1-receipt" | Out-Null
          $Receipt | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\win1-p1-receipt\upload-receipt.json"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win1-p1-upload-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\win1-p1-receipt\upload-receipt.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
