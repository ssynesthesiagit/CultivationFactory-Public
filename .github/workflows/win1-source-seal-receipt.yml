name: WIN1 Temporary Source Seal Receipt

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  seal-source:
    if: github.head_ref == 'work/win1-p1r3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate coupled source commitments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          app = root / "APP"
          ci = root / "ci"
          output = root / "seal-output"
          output.mkdir(parents=True, exist_ok=True)
          (output / "APP").mkdir(parents=True, exist_ok=True)
          (output / "ci").mkdir(parents=True, exist_ok=True)

          sys.path.insert(0, str(ci))
          from common import sha256_file, write_json  # noqa: E402

          manifest_path = app / "PACKAGE_MANIFEST.json"
          sums_path = app / "SHA256SUMS.txt"
          accepted_path = ci / "accepted-source.sha256"
          baseline_path = ci / "source-baseline.json"
          excluded = {"PACKAGE_MANIFEST.json", "SHA256SUMS.txt"}

          def app_files() -> list[Path]:
              return sorted(
                  (path for path in app.rglob("*") if path.is_file()),
                  key=lambda path: path.relative_to(app).as_posix(),
              )

          payload_files = [
              path
              for path in app_files()
              if path.relative_to(app).as_posix() not in excluded
          ]
          payload_records = [
              {
                  "bytes": path.stat().st_size,
                  "path": path.relative_to(app).as_posix(),
                  "sha256": sha256_file(path),
              }
              for path in payload_files
          ]

          prior_manifest = json.loads(manifest_path.read_text(encoding="utf-8-sig"))
          manifest = {
              "checkpoint": prior_manifest.get("checkpoint", "WIN1-PUBLIC-CONTINUATION"),
              "files": payload_records,
          }
          write_json(manifest_path, manifest)
          sums_path.write_text(
              "".join(f"{row['sha256']}  {row['path']}\n" for row in payload_records),
              encoding="utf-8",
          )

          source_files = app_files()
          source_records = [
              {
                  "bytes": path.stat().st_size,
                  "path": path.relative_to(app).as_posix(),
                  "sha256": sha256_file(path),
              }
              for path in source_files
          ]
          accepted_path.write_text(
              "".join(f"{row['sha256']}  {row['path']}\n" for row in source_records),
              encoding="utf-8",
          )
          source_commitment = sha256_file(accepted_path)
          total_bytes = sum(row["bytes"] for row in source_records)

          baseline = json.loads(baseline_path.read_text(encoding="utf-8-sig"))
          baseline["application_source"]["file_count"] = len(source_records)
          baseline["application_source"]["total_bytes"] = total_bytes
          baseline["application_source"]["source_tree_commitment_sha256"] = source_commitment
          write_json(baseline_path, baseline)

          report = {
              "schema": "Tianxia.WIN1.SourceSealReceipt.v1",
              "head_sha": "${{ github.event.pull_request.head.sha }}",
              "checkpoint": manifest["checkpoint"],
              "manifest_record_count": len(payload_records),
              "checksum_record_count": len(payload_records),
              "accepted_source_record_count": len(source_records),
              "application_file_count": len(source_records),
              "application_total_bytes": total_bytes,
              "source_tree_commitment_sha256": source_commitment,
              "generated_paths": [
                  "APP/PACKAGE_MANIFEST.json",
                  "APP/SHA256SUMS.txt",
                  "ci/accepted-source.sha256",
                  "ci/source-baseline.json",
              ],
          }
          write_json(output / "source-seal-receipt.json", report)

          for path in (manifest_path, sums_path):
              shutil.copy2(path, output / "APP" / path.name)
          for path in (accepted_path, baseline_path):
              shutil.copy2(path, output / "ci" / path.name)
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Verify exact APP inventory and manifests
        shell: bash
        run: |
          set -euo pipefail
          python ci/verify_source.py --output seal-output/source-verification.json
          python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          app = root / "APP"
          ci = root / "ci"
          sys.path.insert(0, str(ci))
          from common import sha256_file, write_json  # noqa: E402

          excluded = {"PACKAGE_MANIFEST.json", "SHA256SUMS.txt"}
          actual = {
              path.relative_to(app).as_posix(): {
                  "bytes": path.stat().st_size,
                  "sha256": sha256_file(path),
              }
              for path in app.rglob("*")
              if path.is_file() and path.relative_to(app).as_posix() not in excluded
          }
          manifest = json.loads((app / "PACKAGE_MANIFEST.json").read_text(encoding="utf-8-sig"))
          declared = {
              row["path"]: {"bytes": int(row["bytes"]), "sha256": row["sha256"]}
              for row in manifest["files"]
          }
          sums = {}
          for line in (app / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, relative = line.split("  ", 1)
              sums[relative] = digest
          checks = {
              "manifest_paths_exact": set(declared) == set(actual),
              "manifest_records_exact": declared == actual,
              "checksum_paths_exact": set(sums) == set(actual),
              "checksum_hashes_exact": sums == {path: row["sha256"] for path, row in actual.items()},
          }
          report = {
              "schema": "Tianxia.WIN1.ManifestVerification.v1",
              "status": "PASS" if all(checks.values()) else "PRODUCT_FAILURE",
              "checks": checks,
              "actual_payload_files": len(actual),
              "manifest_records": len(declared),
              "checksum_records": len(sums),
              "missing_from_manifest": sorted(set(actual) - set(declared)),
              "extra_in_manifest": sorted(set(declared) - set(actual)),
              "missing_from_checksums": sorted(set(actual) - set(sums)),
              "extra_in_checksums": sorted(set(sums) - set(actual)),
          }
          write_json(root / "seal-output" / "manifest-verification.json", report)
          print(json.dumps(report, sort_keys=True))
          if report["status"] != "PASS":
              raise SystemExit(1)
          PY

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r APP/requirements/requirements.txt -r APP/requirements/requirements-dev.txt

      - name: Run focused Stage-1-first and route-binding tests
        shell: bash
        env:
          PYTHONPATH: APP
        run: |
          set -euo pipefail
          python -m pytest -q \
            APP/tests/test_win1_linux_e2e_stage1_first_compile.py \
            APP/tests/test_win1_linux_e2e_origin_insight_route_binding.py \
            | tee seal-output/focused-tests.log

      - name: Upload deterministic sealing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win1-source-seal-${{ github.run_id }}-${{ github.run_attempt }}
          path: seal-output
          if-no-files-found: error
          retention-days: 7
