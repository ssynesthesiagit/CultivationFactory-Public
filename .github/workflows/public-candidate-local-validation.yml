name: Public Candidate Local Validation

# Deliberately manual: this repository must not start Actions work merely by
# being inspected or made public. No owner-test or private-repository input is
# used here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-validation:
    name: Public-safe source validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: APP/requirements/requirements-dev.txt

      - name: Install public dependencies
        run: python -m pip install --disable-pip-version-check -r APP\requirements\requirements-dev.txt

      - name: Compile Python and validate JavaScript
        shell: pwsh
        run: |
          python -m compileall -q APP ci
          python ci\check_javascript.py --node node --output ci-javascript.json

      - name: Run public fallback and authority checks
        working-directory: APP
        run: >-
          python -m pytest -q
          tests/test_combat_battle_history.py
          tests/test_ns1r_non_sphere_authority.py
          tests/test_r6_6_5_sphere_talent_authority.py
