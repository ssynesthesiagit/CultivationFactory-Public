name: CI Fast

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast authority checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Begin checkout timing
        shell: pwsh
        run: |
          "CI_OUTPUT=$env:GITHUB_WORKSPACE/ci-results/fast" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOTSTRAP_TIMINGS=$env:RUNNER_TEMP/ci1-fast-bootstrap.ndjson" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $state = @{
            stage = "checkout"
            command_identity = "actions/checkout@v4"
            started_at_utc = [DateTime]::UtcNow.ToString("o")
            started_epoch_ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          }
          $state | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/ci1-fast-checkout.json"

      - name: Check out accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false

      - name: Finish checkout timing and begin dependency timing
        shell: pwsh
        run: |
          $checkout = Get-Content -Raw "$env:RUNNER_TEMP/ci1-fast-checkout.json" | ConvertFrom-Json
          $ended = [DateTimeOffset]::UtcNow
          $record = @{
            stage = $checkout.stage
            command_identity = $checkout.command_identity
            started_at_utc = $checkout.started_at_utc
            ended_at_utc = $ended.UtcDateTime.ToString("o")
            elapsed_seconds = [Math]::Round(($ended.ToUnixTimeMilliseconds() - $checkout.started_epoch_ms) / 1000.0, 6)
            status = "PASS"
            exit_code = 0
          }
          $record | ConvertTo-Json -Compress | Add-Content -Encoding utf8 "$env:BOOTSTRAP_TIMINGS"
          $dependency = @{
            stage = "dependency_setup"
            command_identity = "actions/setup-python@v5 + actions/setup-node@v4 + locked Python dependencies + Playwright Chromium"
            started_at_utc = [DateTime]::UtcNow.ToString("o")
            started_epoch_ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          }
          $dependency | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/ci1-fast-dependencies.json"

      - name: Set up Python
        id: python_setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: APP/requirements/requirements-dev.txt

      - name: Set up Node.js
        id: node_setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install locked application dependencies
        id: dependency_install
        run: python -m pip install --disable-pip-version-check -r APP/requirements/requirements-dev.txt

      - name: Install deterministic Chromium runtime
        id: browser_install
        run: python -m playwright install --with-deps chromium

      - name: Finish dependency timing
        if: always()
        shell: pwsh
        run: |
          $dependency = Get-Content -Raw "$env:RUNNER_TEMP/ci1-fast-dependencies.json" | ConvertFrom-Json
          $ended = [DateTimeOffset]::UtcNow
          $dependencyStatus = if ("${{ steps.python_setup.outcome }}" -eq "success" -and "${{ steps.node_setup.outcome }}" -eq "success" -and "${{ steps.dependency_install.outcome }}" -eq "success" -and "${{ steps.browser_install.outcome }}" -eq "success") { "PASS" } else { "FAIL" }
          $dependencyExitCode = if ($dependencyStatus -eq "PASS") { 0 } else { 1 }
          $record = @{
            stage = $dependency.stage
            command_identity = $dependency.command_identity
            started_at_utc = $dependency.started_at_utc
            ended_at_utc = $ended.UtcDateTime.ToString("o")
            elapsed_seconds = [Math]::Round(($ended.ToUnixTimeMilliseconds() - $dependency.started_epoch_ms) / 1000.0, 6)
            status = $dependencyStatus
            exit_code = $dependencyExitCode
          }
          $record | ConvertTo-Json -Compress | Add-Content -Encoding utf8 "$env:BOOTSTRAP_TIMINGS"

      - name: Run fast tier
        run: python ci/run_tier.py fast --output "$CI_OUTPUT" --node node --seed-timings "$BOOTSTRAP_TIMINGS"

      - name: Finalize bounded evidence
        if: always()
        run: python ci/finalize_artifacts.py --tier fast --output "$CI_OUTPUT" --node node --seed-timings "$BOOTSTRAP_TIMINGS"

      - name: Begin artifact upload timing
        if: always()
        run: python ci/record_timing.py begin --stage artifact_upload --command "actions/upload-artifact@v4 ci-fast-evidence" --state "$RUNNER_TEMP/ci1-fast-upload.json"

      - name: Upload bounded fast evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-fast-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/fast/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Record artifact upload timing
        if: always()
        shell: pwsh
        run: |
          $status = if ("${{ steps.evidence_upload.outcome }}" -eq "success") { "PASS" } else { "FAIL" }
          $exitCode = if ($status -eq "PASS") { 0 } else { 1 }
          python ci/record_timing.py finish --state "$env:RUNNER_TEMP/ci1-fast-upload.json" --output "$env:CI_OUTPUT/stage-timings.json" --status $status --exit-code $exitCode
          python ci/finalize_artifacts.py --tier fast --output "$env:CI_OUTPUT" --node node

      - name: Upload timing receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-fast-upload-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/fast/stage-timings.json
            ci-results/fast/artifact-index.json
            ci-results/fast/classification.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
