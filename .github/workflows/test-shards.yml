name: Public test shards
on:
  push:
    branches: ['test/**']
permissions:
  contents: read
concurrency:
  group: public-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      node: ${{ steps.plan.outputs.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: plan
        run: python3 ci/public_test_plan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan
          path: plan.json
          if-no-files-found: error
      - id: resolve
        # Resolve once so every shard compares the same public snapshot.
        run: |
          sha=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/test/main | awk '{print $1}')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Publish the reviewed test/main snapshot first'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  pytest:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # A failed shard must not cancel the remaining result producers.
      fail-fast: false
      max-parallel: 19
      matrix: ${{ fromJSON(needs.baseline.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: 'APP/requirements/*.txt'
      - uses: actions/setup-node@v4
        if: matrix.needs_node
        with:
          node-version: '26.2.0'
      - uses: actions/cache@v4
        if: matrix.needs_node
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-26.2.0-${{ hashFiles('**/package-lock.json', 'APP/**/*.mjs', 'APP/**/*.js') }}
          restore-keys: npm-${{ runner.os }}-26.2.0-
      - run: python -m pip install -r APP/requirements/requirements-dev.txt
      - name: Resolve public snapshot replay baseline
        # Both trees are parentless public snapshots. Never fetch private Git
        # history. Publish reviewed main to test/main before any lane snapshot.
        run: |
          git fetch --depth=1 "https://github.com/${{ github.repository }}.git" '${{ needs.baseline.outputs.sha }}'
          base=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          # Guards read APP blobs directly with ls-tree/cat-file; no ancestor
          # history or separate worktree is needed for this public snapshot.
          git cat-file -e "$base:APP/tests/replay_base.py"
          git cat-file -e "$base:APP/tests/wall_height_stock_capture.py"
          echo "CF_REPLAY_BASE=$base" >> "$GITHUB_ENV"
      - run: python ci/public_test_shard.py --count ${{ needs.baseline.outputs.count }} --index ${{ matrix.shard }}
        if: always()
        env:
          PYTHONPATH: APP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.shard }}
          path: result.json
          if-no-files-found: error
  node:
    needs: baseline
    if: needs.baseline.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '26.2.0'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-26.2.0-${{ hashFiles('**/package-lock.json', 'APP/**/*.mjs', 'APP/**/*.js') }}
          restore-keys: npm-${{ runner.os }}-26.2.0-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python ci/public_test_shard.py --node
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node
          path: result.json
          if-no-files-found: error
